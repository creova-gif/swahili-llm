version: '3.8'

services:
  lughallm-api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: lughallm-api
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=LughaLLM
      - APP_VERSION=1.0.0
      - ENVIRONMENT=production
      - PORT=8000
      - DATABASE_PATH=/app/data/lughallm_ledger.sqlite3
      - LOG_LEVEL=info
    volumes:
      - lughallm-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  ollama-edge:
    image: ollama/ollama:latest
    container_name: lughallm-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  lughallm-data:
    driver: local
  ollama-models:
    driver: local
