steps:
  # 1. Run Unit Tests & SWAHILI-BENCH Verification
  - name: 'python:3.11-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install -r lughallm/requirements.txt
        python -m pytest lughallm/tests/ -v

  # 2. Build Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/lughallm-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/lughallm-api:latest'
      - '-f'
      - 'lughallm/infra/Dockerfile'
      - '.'

  # 3. Push to Google Artifact / Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/lughallm-api:$COMMIT_SHA'

  # 4. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'lughallm-api'
      - '--image=gcr.io/$PROJECT_ID/lughallm-api:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=4Gi'
      - '--cpu=2'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--set-env-vars=ENVIRONMENT=production'

images:
  - 'gcr.io/$PROJECT_ID/lughallm-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/lughallm-api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
