name: LughaLLM CI & SWAHILI-BENCH Verification

on:
  push:
    paths:
      - 'lughallm/**'
      - '.github/workflows/lughallm-ci.yml'
  pull_request:
    paths:
      - 'lughallm/**'
      - '.github/workflows/lughallm-ci.yml'

jobs:
  test-and-benchmark:
    name: Unit Tests & Pan-African SWAHILI-BENCH
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Test Suite (Zero-Dependency Standard Library)
        run: |
          python -m unittest discover -s lughallm/tests -p "test_*.py" -v

      - name: Run SWAHILI-BENCH Benchmark Evaluation
        run: |
          python -m lughallm.src.benchmark.swahili_bench

      - name: Run Interactive Showcase Simulation
        run: |
          python lughallm/demo.py

      - name: Install Package & Verify CLI Entrypoint
        run: |
          pip install ./lughallm
          lughallm --help
          lughallm bench --model lughallm
