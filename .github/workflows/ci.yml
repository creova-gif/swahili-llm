name: Swahili-LLM CI & SWAHILI-BENCH Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-benchmark:
    name: Unit Tests & SWAHILI-BENCH Harness
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Test Suite (Zero-Dependency Standard Library Mode)
        run: |
          python -m unittest discover -s lughallm/tests -p "test_*.py" -v

      - name: Run SWAHILI-BENCH Evaluator Self-Test
        run: |
          python -m lughallm.src.benchmark.swahili_bench

      - name: Run Interactive Showcase Simulation
        run: |
          python lughallm/demo.py

      - name: Install Package, Run Full FastAPI Integration Tests & Verify CLI
        run: |
          pip install .
          python -m unittest discover -s lughallm/tests -p "test_*.py" -v
          lughallm --help
          lughallm bench --model lughallm

      - name: Verify Installed Package Ships SWAHILI-BENCH Dataset
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import importlib.resources as r; p = r.files('lughallm.src.benchmark') / 'dataset.json'; assert p.is_file(), f'dataset.json missing from installed package: {p}'; print('OK', p)"
          lughallm bench --model lughallm
